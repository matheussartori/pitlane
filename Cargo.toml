[workspace]
resolver = "3"
members = ["crates/pit-core", "crates/pitd", "crates/pit", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/matheussartori/pitlane"

[workspace.dependencies]
pit-core = { path = "crates/pit-core" }
pitd = { path = "crates/pitd" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"
