name: Bug report
description: Something in Pitlane doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Board
        2. Click Run all
        3. …
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Pitlane version or commit
      placeholder: 0.0.1 or a commit hash
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 26.1, Apple M3
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: For a run, `pit log <run>` helps. Remove anything private first.
      render: text
